# CI — PR checks (esqueleto, candidato a Kit)
#
# Enforcea las convenciones de CONSTITUTION.md que pueden chequearse en CI:
#   - naming de rama: agent/<figura>/<JIRA-KEY>   (§3) — IMPLEMENTADO
#   - presencia del label module/agent en el issue  (§4) — TODO (requiere API Jira)
#   - DoD: tests verdes + verify-report             (§6) — TODO (depende del stack, Fase 1)
#
# Mover a .github/workflows/ cuando se decida el provider de CI (asumido GitHub Actions).

name: pr-checks
on:
  pull_request:
    branches: [develop]

jobs:
  branch-name:
    name: Naming de rama (agent/<figura>/<JIRA-KEY>)
    runs-on: ubuntu-latest
    steps:
      - name: Validar nombre de rama
        run: |
          BRANCH="${GITHUB_HEAD_REF}"
          echo "Rama: $BRANCH"
          if [[ ! "$BRANCH" =~ ^agent/[a-z]+/TAL-[0-9]+$ ]]; then
            echo "::error::La rama '$BRANCH' no cumple agent/<figura>/TAL-<n> (CONSTITUTION.md §3)"
            exit 1
          fi

  labels:
    name: Invariante de labels (TODO)
    runs-on: ubuntu-latest
    steps:
      - name: Verificar 1 agent:* + 1 module:* en el issue ligado
        run: |
          echo "TODO: consultar la API de Jira y validar el invariante de CONSTITUTION.md §4."
          echo "Requiere token + resolver el JIRA-KEY desde el nombre de rama."

  dod:
    name: Definition of Done (TODO — depende del stack)
    runs-on: ubuntu-latest
    steps:
      - name: Tests + verify-report
        run: |
          echo "TODO: correr la suite de tests y publicar verify-report como artefacto."
          echo "Se concreta al fijar el stack en Fase 1."
