name: pr-checks
on:
  pull_request:
    branches: [develop]

jobs:
  branch-name:
    name: Naming de rama (agent/<figura>/<JIRA-KEY>)
    runs-on: ubuntu-latest
    steps:
      - name: Validar nombre de rama
        run: |
          BRANCH="${GITHUB_HEAD_REF}"
          echo "Rama: $BRANCH"
          if [[ ! "$BRANCH" =~ ^agent/[a-z]+/TAL-[0-9]+$ ]]; then
            echo "::error::La rama '$BRANCH' no cumple agent/<figura>/TAL-<n> (CONSTITUTION.md §3)"
            exit 1
          fi

  labels:
    name: Invariante de labels (ch labels)
    runs-on: ubuntu-latest
    needs: branch-name
    environment: develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build ch
        working-directory: platform/ci-checks
        run: go build -o /tmp/ch ./cmd/ch
      - name: Check label invariant
        working-directory: ${{ github.workspace }}
        env:
          JIRA_SITE_URL: ${{ secrets.JIRA_SITE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: /tmp/ch labels --branch "$GITHUB_HEAD_REF" --json

  dod:
    name: Definition of Done
    runs-on: ubuntu-latest
    needs: branch-name
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build ch
        working-directory: platform/ci-checks
        run: go build -o /tmp/ch ./cmd/ch
      - name: Run Go tests for changed modules
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | /tmp/ch changed-modules)
          for dir in $CHANGED; do
            if [ -f "$dir/go.mod" ]; then
              echo "Running go test -short ./... in $dir"
              (cd "$dir" && go test -short ./...)
            fi
          done
      - name: Vitest placeholder (frontend — TODO Fase 5+)
        run: |
          echo "vitest: no frontend changes detected or not yet wired"
      - name: Assert verify-report present for touched change(s)
        run: |
          # Derive the change folder(s) this PR touches — active or archived — and
          # require EACH to have its own verify-report.md (per-change, not "any report anywhere").
          CHANGE_DIRS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^openspec/changes/(archive/)?[^/]+/' \
            | sed -E 's#^(openspec/changes/(archive/)?[^/]+)/.*#\1#' \
            | sort -u)
          if [ -z "$CHANGE_DIRS" ]; then
            echo "::notice::No SDD change touched — verify-report check N/A"
            exit 0
          fi
          missing=0
          for dir in $CHANGE_DIRS; do
            if [ ! -f "$dir/verify-report.md" ]; then
              echo "::error::No verify-report.md in $dir — DoD requires a verify-report for this change"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

  overlap:
    # Collision guard (HG6): cross the REAL diffs of every OPEN agent PR against the base.
    # Hard gate — fails the PR when two in-flight PRs touch the same file (verdict BLOCK).
    # The in-flight set is the OPEN-PR head branches from `gh pr list` (the source of truth for
    # "what's live"); `ov` stays git-only, so stale squash-merged branches that `git ls-remote`
    # would surface are excluded by construction. A single in-flight PR (or none) → no pairs → OK.
    name: Overlap collision guard (HG6)
    runs-on: ubuntu-latest
    needs: branch-name
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build ov
        working-directory: platform/overlap-guard
        run: go build -o /tmp/ov ./cmd/ov
      - name: Fetch base and in-flight agent branches
        # ov diffs each open-PR head (origin/agent/*) three-dot against the base. Fetch BOTH explicitly
        # so the scan never rests on an assumption about what the PR checkout left behind.
        run: |
          git fetch origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" \
            '+refs/heads/agent/*:refs/remotes/origin/agent/*'
      - name: Cross open-PR diffs for file collisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # In-flight set = OPEN PRs TARGETING THIS BASE. --base scoping is load-bearing: ov diffs
          # every head three-dot against origin/<base>, so a PR to a DIFFERENT base (a stacked PR, a
          # main hotfix) would be mis-diffed and manufacture phantom collisions. Fail loud if gh errors.
          PRS_JSON=$(gh pr list --state open --base "${{ github.base_ref }}" --limit 1000 --json headRefName) \
            || { echo "::error::gh pr list failed"; exit 1; }
          COUNT=$(jq 'length' <<<"$PRS_JSON")
          # --limit is a hard cap; if we hit it the set may be silently truncated (and the sentinel
          # below can't detect it — the current PR sorts first and survives the cut). Refuse to pass a
          # possibly-incomplete collision gate: a dropped colliding PR would be a false GREEN.
          if [ "$COUNT" -ge 1000 ]; then
            echo "::error::open-PR count hit the 1000 cap — in-flight set may be truncated; refusing to pass HG6"; exit 1
          fi
          BRANCHES=$(jq -r '[.[].headRefName] | join(",")' <<<"$PRS_JSON")
          echo "In-flight PRs to ${{ github.base_ref }}: ${COUNT} — ${BRANCHES:-<none>}"
          # Fail-closed sentinel: THIS PR targets this base and is open, so it MUST appear. If not, gh
          # returned a wrong/partial set — do NOT pass (an empty --branches would mean ErrNoClaims → exit 0).
          case ",$BRANCHES," in
            *",$GITHUB_HEAD_REF,"*) : ;;
            *) echo "::error::open-PR list missing this PR's branch ($GITHUB_HEAD_REF) — refusing to pass HG6"; exit 1 ;;
          esac
          # SCOPE (HG6): ov keys collisions on agent identity (figura) and skips same-agent pairs per the
          # overlap-guard spec REQ-VERDICT-2 — two OPEN PRs from the SAME figura on the same file are NOT
          # flagged here. That is the canonical cross-agent semantics; widening it is a spec change (ZEUS),
          # not CI wiring. Non-agent heads are dropped by ov (branch-name blocks them from merging anyway).
          /tmp/ov scan --remote --branches "$BRANCHES" --base "origin/${{ github.base_ref }}" --no-fetch

  judgment:
    # Archive-scoped gate (HG5): fires ONLY when this PR moves a change folder
    # into openspec/changes/archive/<date>-<slug>/. Feature PRs are NOT gated
    # here — the gate applies at archive-time, not at feature-merge time (C1/C3
    # hardening: no bypass via empty CHANGES on non-archive PRs).
    name: Judgment Day archive gate (HG5)
    runs-on: ubuntu-latest
    needs: branch-name
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build ch
        working-directory: platform/ci-checks
        run: go build -o /tmp/ch ./cmd/ch
      - name: Assert judgment-report APPROVED for archived change(s)
        run: |
          # Derive archived change folders from the diff.
          # Only paths matching openspec/changes/archive/<date>-<slug>/ count.
          ARCHIVE_FOLDERS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^openspec/changes/archive/[^/]+/' \
            | sed -E 's#^openspec/changes/archive/([^/]+)/.*#\1#' \
            | sort -u)
          if [ -z "$ARCHIVE_FOLDERS" ]; then
            echo "::notice::Not an archive PR — HG5 judgment gate N/A"
            exit 0
          fi
          for dated_slug in $ARCHIVE_FOLDERS; do
            # Strip leading YYYY-MM-DD- prefix to get the bare change slug.
            slug=$(echo "$dated_slug" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')
            report_path="openspec/changes/archive/${dated_slug}/judgment-report.md"
            echo "Checking judgment gate for archived change: $slug (report: $report_path)"
            /tmp/ch judgment --change "$slug" --report "$report_path"
          done
